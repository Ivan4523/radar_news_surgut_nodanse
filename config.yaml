  - {word: "приглашаем", w: -15}
  - {word: "анонс", w: -10}
  - {word: "акция", w: -10}

# ===== Источники =====
# type: rss | html | telegram
#
# priority 1..5 — насколько источник важен для Сургута: добавляет priority*3 к баллу.
# trust    1..5 — насколько ему можно верить без перепроверки (достоверность):
#                 5 власть и официальные страницы, 4 проверенные СМИ, 3 средний уровень,
#                 2 «народные» каналы (быстро, но бывают слухи), 1 слухи и анонимки.
#                 Влияет на балл (см. trust_weight) и на пометку 🟢/🟡/🔴 в уведомлении.
# kind     — тип для отчётов: official | media | community | author
# geo_hint — базовая география источника (ключ из geo_weights), если в тексте нет города.
#
# Для Telegram достаточно написать ник канала: "@name", "t.me/name" или ссылку целиком.
# Как узнать ник: откройте канал в Telegram, нажмите на его название, ник стоит после @.
# Проверить, что источник живой, можно в меню радара: пункт 6.
sources:
  # ---------- Официальные источники (власть) ----------
  - name: Администрация Сургута (RSS)
    type: rss
    url: https://admsurgut.ru/bitrix/rss.php?ID=45&LANG=s1&TYPE=news&LIMIT=20
    kind: official
    geo_hint: сургут
    priority: 5
    trust: 5
    enabled: true

  - name: Мэрия Сургута (Telegram)
    type: telegram
    url: https://t.me/s/admsurgut
    kind: official
    geo_hint: сургут
    priority: 5
    trust: 5
    enabled: true

  - name: Правительство Югры (Telegram)
    type: telegram
    url: https://t.me/s/ugra_official
    kind: official
    geo_hint: югра
    priority: 4
    trust: 5
    enabled: true

  - name: Руслан Кухарук, губернатор Югры (Telegram)
    # Официальный канал главы региона: достоверно, но чаще про всю Югру, чем про Сургут
    type: telegram
    url: "@kuharuk_ruslan"
    kind: official
    geo_hint: югра
    priority: 4
    trust: 5
    enabled: true

  - name: Правительство ХМАО — Югры (сайт)
    type: html
    url: https://admhmao.ru/news/
    kind: official
    geo_hint: югра
    item_selector: "a[href^='/news/']"
    priority: 4
    trust: 5
    enabled: false   # сайт отвечает ошибкой 447; Югру читаем через Telegram

  # ---------- СМИ ----------
  - name: SiTV, Сургутинформтв (сайт)
    type: html
    url: https://sitv.ru/arhiv/news/
    kind: media
    geo_hint: сургут
    item_selector: "a[href*='/arhiv/news/']"
    exclude_href: ["/tag/"]      # страницы тегов не новости
    min_title_len: 25
    priority: 5
    trust: 4
    enabled: true

  - name: SiTV, Новости Сургута и Югры (Telegram)
    type: telegram
    url: "@sitvnews"
    kind: media
    geo_hint: сургут
    priority: 5
    trust: 4
    enabled: true

  # ---------- «Народные» каналы: быстро, но требуют перепроверки ----------
  - name: К-информ Сургут (Telegram)
    # Самый большой городской канал (около 80 тысяч подписчиков): часто первым пишет
    # о происшествиях, но это «народный» канал, поэтому trust 2.
    type: telegram
    url: "@kinform"
    kind: community
    geo_hint: сургут
    priority: 4
    trust: 2
    enabled: true

  - name: Новости Югры (Telegram)
    # Небольшой канал (около 4 тысяч подписчиков): приоритет низкий, trust 2
    type: telegram
    url: "@news_ugra"
    kind: community
    geo_hint: югра
    priority: 2
    trust: 2
    enabled: true

  # Добавляйте свои источники по образцу выше.
  # Для сайтов подберите CSS-селектор списка новостей через "Просмотр кода".

  # ---------- Добавлено позже ----------
  - name: Югра ХМАО (Telegram, агрегатор происшествий)
    # Канал-подборка по округу (ДТП, ГИБДД, спасатели, перепосты). Неофициальный: trust 2.
    type: telegram
    url: "@UGRAXMAO"
    kind: community
    geo_hint: югра
    priority: 3
    trust: 2
    enabled: true

  - name: Сургут СМИ (Telegram, народный канал)
    # Городской канал: быстрый, но неофициальный, поэтому trust 2.
    type: telegram
    url: "@surgut_smi"
    kind: community
    geo_hint: сургут
    priority: 3
    trust: 2
    enabled: true